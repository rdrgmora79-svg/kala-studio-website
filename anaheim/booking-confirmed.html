<script>
/* Kala Anaheim · Vagaro: booking_confirmed (sanitized, deduplicated).
   Anaheim/Vagaro ONLY: no Uzeli/GZBooker, no Westlake IDs or callbacks.
   Fires ONLY here (Vagaro "Redirect After Booking"), never from a Book Now click, and only when a booking attempt
   created by an Anaheim CTA exists in this tab's sessionStorage and has not been reported yet.
   Payload carries no PII and no click IDs/UTMs (attribution stays in sessionStorage 'kala_attr'). */
(function (w, d) {
  'use strict';
  var TTL = 30 * 60 * 1000, ATTEMPT_KEY = 'kala_an_attempt', SENT_KEY = 'kala_an_sent';
  var PLACEMENTS = ['hero', 'nav', 'sticky', 'services', 'location_selector', 'booking_section', 'deals', 'other'];
  function ssGet(k) { try { return w.sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { w.sessionStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
  function ssDel(k) { try { w.sessionStorage.removeItem(k); } catch (e) { /* noop */ } }

  var attempt = null, raw = ssGet(ATTEMPT_KEY);
  if (raw) { try { attempt = JSON.parse(raw); } catch (e) { attempt = null; } }
  if (!attempt || !attempt.id || typeof attempt.t !== 'number' || (Date.now() - attempt.t) >= TTL) return;   // direct visit / refresh / expired
  if (!/^[A-Za-z0-9_\-]{8,80}$/.test(String(attempt.id))) return;

  var sent = {};
  try { sent = JSON.parse(ssGet(SENT_KEY) || '{}') || {}; } catch (e) { sent = {}; }
  if (sent[attempt.id]) return;                                    // already reported for this attempt

  var placement = PLACEMENTS.indexOf(attempt.placement) > -1 ? attempt.placement : 'other';
  w.dataLayer = w.dataLayer || [];
  w.dataLayer.push({
    event: 'booking_confirmed',
    location: 'anaheim',
    booking_provider: 'vagaro',
    event_id: attempt.id,
    booking_attempt_id: attempt.id,
    cta_placement: placement,
    confirm_source: 'vagaro_redirect',
    value: 0,
    currency: 'USD'
  });
  sent[attempt.id] = 1;
  ssSet(SENT_KEY, JSON.stringify(sent));
  ssDel(ATTEMPT_KEY);
})(window, document);
</script>
